<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пиццерия</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Конструктор пиццы</h1>
        
        <div class="card">
            <h2>Выберите пиццу:</h2>
            <select id="pizzaType">
                <option value="margherita">Маргарита (500 руб., 300 ккал)</option>
                <option value="pepperoni">Пепперони (800 руб., 400 ккал)</option>
                <option value="bavarian">Баварская (700 руб., 450 ккал)</option>
            </select>
        </div>

        <div class="card">
            <h2>Выберите размер (обязательно):</h2>
            <label>
                <input type="radio" name="size" value="LARGE" checked> 
                Большая (+200 руб., +200 ккал)
            </label><br>
            <label>
                <input type="radio" name="size" value="SMALL"> 
                Маленькая (+100 руб., +100 ккал)
            </label>
        </div>

        <div class="card">
            <h2>Добавки:</h2>
            <label>
                <input type="checkbox" id="mozzarella" value="MOZZARELLA"> 
                Сливочная моцарелла (+50 руб., +20 ккал)
            </label><br>
            <label>
                <input type="checkbox" id="cheeseBord" value="CHEESE_BORD"> 
                Сырный борт (+150 руб. для мал / +300 руб. для бол, +50 ккал)
            </label><br>
            <label>
                <input type="checkbox" id="cheddar" value="CHEDDAR_PARMEZAN"> 
                Чедер и пармезан (+150 руб. для мал / +300 руб. для бол, +50 ккал)
            </label>
        </div>

        <button onclick="calculatePizza()">Рассчитать стоимость</button>

        <div id="result" class="result"></div>
    </div>

    <script src="pizza.js"></script>
    <script src="pizza-types.js"></script>
    <script src="main.js"></script>
</body>
</html>
